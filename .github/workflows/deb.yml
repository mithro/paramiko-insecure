name: Debian package + apt repo

# Builds python3-paramiko-insecure -- Debian's paramiko 5 with the obsolete SSH
# algorithms upstream removed restored, installed as the separate module
# paramiko_insecure -- for bookworm, trixie, forky and sid, tests each build against a
# real obsolete-only OpenSSH server, and publishes a signed apt repository to
# GitHub Pages.
#
# The weekly schedule rebuilds against each suite's current dependencies and
# checks whether Debian has uploaded a newer paramiko that this fork should be
# rebased onto.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

# Least privilege by default: only the publish job raises this, and only for
# itself.
permissions:
  contents: read

jobs:
  build-deb:
    name: deb (${{ matrix.suite }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # forky is Debian testing. sid also reports VERSION_CODENAME=forky
        # in /etc/os-release, so publishing forky keeps the README's
        # one-line sources.list entry correct on sid too.
        suite: [bookworm, trixie, forky, sid]
        # python3-paramiko-insecure is Architecture: all, but its tests run
        # it with python3-cryptography-insecure, which is compiled: test on
        # amd64 and arm64 (the machines this is used from are frequently
        # Raspberry Pis). python3-cryptography-insecure itself is built by
        # mithro/cryptography-insecure, for every architecture.
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Build-dependencies resolve from the suite's own archive. bookworm
      # builds with the nocheck profile (no python3-pytest-relaxed there);
      # the other suites run the full upstream test suite during the build.
      # Examples must never alias paramiko_insecure: an alias hides which
      # connections are unprotected.
      - name: Check the docs keep the module's name
        run: python3 packaging/check-docs.py

      # The private copy of cryptography comes from its own repository,
      # mithro/cryptography-insecure, declared in .github/apt-packaging.toml
      # ([[depends]], bundled). apt-sources/ adds it for the build (verified
      # with its key); apt-sources-unbundled/ adds only the dependency
      # repositories we don't bundle (none), for the tests below.
      - name: Check out apt-repo-action's scripts
        uses: actions/checkout@v5
        with:
          repository: mithro/apt-repo-action
          ref: main
          path: .apt-repo-action
      - name: Dependency repositories
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -eux
          python3 .apt-repo-action/scripts/apt-sources.py write --suite "$SUITE" --dest apt-sources
          python3 .apt-repo-action/scripts/apt-sources.py write --unbundled --suite "$SUITE" \
            --dest apt-sources-unbundled

      - name: Build python3-paramiko-insecure in debian:${{ matrix.suite }}
        run: |
          set -eux
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/w" -w /w \
            debian:${{ matrix.suite }} sh packaging/build.sh

      # What our apt site will bundle from mithro/cryptography-insecure for
      # this suite and architecture (verified against its signed index): the
      # tests below install from it and from nothing else of ours, so they
      # prove our repository alone is enough.
      - name: Bundled packages
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ matrix.suite }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 .apt-repo-action/scripts/bundle-depends.py fetch --suite "$SUITE" \
            --arch "$ARCH" --debs built-debs --dest bundled-debs
          ls -l bundled-debs

      # Install next to stock python3-paramiko and connect to an sshd that
      # only speaks obsolete algorithms. Gates publishing.
      - name: End-to-end test in a clean debian:${{ matrix.suite }}
        run: |
          set -eux
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/w" -w /w \
            debian:${{ matrix.suite }} sh packaging/e2e.sh

      # Against SSH servers of the era this package exists for: OpenSSH
      # 4.3p2 and Dropbear 0.48 from Debian etch (2007), and an OpenSSH
      # 9.8p1 built like the insecure-ssh-keyscan tool. Also gates
      # publishing.
      # The etch images (OpenSSH 4.3p2, Dropbear 0.48) exist only for i386
      # and amd64, so on arm64 only the OpenSSH 9.8p1 server, which is built
      # from source, can run. The old servers are covered by the amd64 jobs.
      - name: Interop with 2007-era SSH servers
        run: |
          python3 packaging/interop/run.py --suite ${{ matrix.suite }} \
            ${{ matrix.arch == 'arm64' && '--only openssh98' || '' }}

      # Only our own package: publish-apt bundles python3-cryptography-insecure
      # from its repository itself. The artifact name carries the arch
      # because the shared publish workflow regroups on debs-<suite>-<arch>.
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: built-debs/*.deb
          if-no-files-found: error

  # ARMv6 Raspberry Pis (Zero, Pi 1) can't run Debian's armhf (ARMv7)
  # python3-cryptography-insecure, so the Raspbian suites carry
  # cryptography-insecure's Raspbian build, bundled (mithro/apt-repo-action
  # docs/packaging.md, "Suites"). python3-paramiko-insecure is Architecture:
  # all with the same version in every suite, so raspbian-<codename> gets the
  # very file built for <codename>; this job tests it in the Raspbian root
  # with the bundled ARMv6 build, then uploads it for the Raspbian suite.
  raspbian:
    name: raspbian-${{ matrix.codename }}
    needs: build-deb
    strategy:
      fail-fast: false
      matrix:
        codename: [bookworm, trixie, forky]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Check out apt-repo-action's scripts
        uses: actions/checkout@v5
        with:
          repository: mithro/apt-repo-action
          ref: main
          path: .apt-repo-action
      - uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.codename }}-amd64
          path: built-debs
      - name: Dependency repositories, and the bundled Raspbian packages
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: raspbian-${{ matrix.codename }}
        run: |
          set -eux
          python3 .apt-repo-action/scripts/apt-sources.py write --unbundled --suite "$SUITE" \
            --dest apt-sources-unbundled
          python3 .apt-repo-action/scripts/bundle-depends.py fetch --suite "$SUITE" \
            --arch armhf --debs built-debs --dest bundled-debs
          ls -l built-debs bundled-debs
      # The Raspbian (ARMv6) root build-deb builds in; nothing is built here.
      - name: Prepare the Raspbian root
        id: root
        uses: ./.apt-repo-action/build-deb
        with:
          suite: raspbian-${{ matrix.codename }}
          arch: armhf
          build: "false"
      # Ours install from the suite alone; the test's own tools (an SSH
      # server, stock paramiko) may fall back to Raspbian's staging, which a
      # half-copied testing codename needs (packaging/e2e.sh).
      - name: End-to-end test in a clean raspbian-${{ matrix.codename }}
        env:
          IMAGE: ${{ steps.root.outputs.image }}
          PLATFORM: ${{ steps.root.outputs.platform }}
          E2E_RASPBIAN_CODENAME: ${{ matrix.codename }}
        run: |
          set -eux
          docker run --rm --platform "$PLATFORM" -e E2E_RASPBIAN_CODENAME \
            -v "$GITHUB_WORKSPACE:/w" -w /w \
            "$IMAGE" sh packaging/e2e.sh
      - name: Test tools taken from Raspbian staging
        if: always()
        env:
          CODENAME: ${{ matrix.codename }}
        run: |
          set -eu
          f=e2e-notes/from-staging
          if [ ! -f "$f" ]; then
            echo "raspbian-$CODENAME: the test's tools all installed from the suite alone"
            exit 0
          fi
          n=$(grep -c . "$f" || true)
          echo "::warning title=Raspbian staging::raspbian-$CODENAME: $n of the end-to-end test's own packages came from $CODENAME-staging (ours came from the suite alone)"
          {
            echo "### raspbian-$CODENAME: test tools from $CODENAME-staging"
            echo
            echo "Our packages installed from the suite alone; these test-only packages needed staging:"
            echo
            echo '```'
            cat "$f"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: debs-raspbian-${{ matrix.codename }}-all
          path: built-debs/python3-paramiko-insecure_*.deb
          if-no-files-found: error

  publish-apt:
    # Build on pull requests to validate, but never publish from one.
    if: github.event_name != 'pull_request'
    needs: [build-deb, raspbian]
    # Scoped to this job alone, not the workflow.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "bookworm trixie forky sid raspbian-bookworm raspbian-trixie raspbian-forky"
      description: "paramiko with obsolete, insecure SSH algorithms, as paramiko_insecure"
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}

  debian-version:
    # Separate from the build so a pending rebase never blocks publishing a
    # fix; a failing scheduled run is the notification.
    name: newer Debian paramiko?
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 packaging/check-debian-version.py sid
